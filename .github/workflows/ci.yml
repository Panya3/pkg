name: ci

# CI is the build environment for this hub (docs/adr/0002): nothing is built on a
# developer machine. Every branch whose content is meant to be trusted builds
# here — the experiment branch while it is being proven, main once it lands, and
# every pull request aimed at main.
#
# Three jobs on purpose. `hub` builds one (arch, config) column; `publish` folds
# the columns into the single artifact the layout promises; `consume` builds
# nothing at all, downloads that artifact and uses it the way another project
# would. Splitting them is what lets the last job prove the hub's actual promise —
# the published bin/ — instead of the build tree it happened to come from.
on:
  push:
    branches:
      - main
      - cmake/harness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: hub (${{ matrix.arch }} ${{ matrix.config }})
    # Pinned image label, not windows-latest: the toolchain (VS 2022, CMake) is
    # part of the input here, so it must not move under us. It is also why both
    # architectures build on this one runner — windows-2022 is the pinned image and
    # Win32 builds natively on it, so x86 costs configuration time, nothing more.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      # Written out rather than crossed automatically: the arch name used in the
      # layout, the VS platform spelling and the preset names are three different
      # words for the same thing, and this is the one place they are tied together.
      matrix:
        include:
          - arch: x64
            platform: x64
            configure: ci-x64
            build: x64-Debug
            config: Debug
          - arch: x64
            platform: x64
            configure: ci-x64
            build: x64-Release
            config: Release
          - arch: x86
            platform: Win32
            configure: ci-x86
            build: x86-Debug
            config: Debug
          - arch: x86
            platform: Win32
            configure: ci-x86
            build: x86-Release
            config: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      # Shallow everywhere, recursively, because mbedtls needs its nested
      # `framework` submodule or its configure aborts.
      - name: Clone vendor submodules (shallow, recursive)
        run: git submodule update --init --recursive --depth 1 --jobs 4

      - name: Show toolchain
        run: |
          echo "arch=${{ matrix.arch }} platform=${{ matrix.platform }} config=${{ matrix.config }}"
          cmake --version
          git --version

      - name: Guard — CMake too old (>= 3.25 required)
        shell: bash
        run: |
          set -euo pipefail
          version="$(cmake --version | head -n1 | sed -E 's/[^0-9.]//g')"
          required="3.25"
          oldest="$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)"
          if [ "$oldest" != "$required" ]; then
            echo "CMake $version is older than the required $required" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}

      - name: Assert the staged hub is complete and signed off
        shell: bash
        run: |
          set -euo pipefail
          config="${{ matrix.config }}"
          arch="${{ matrix.arch }}"

          echo "--- bin/include"
          ls bin/include
          echo "--- bin/lib"
          find bin/lib -type f | sort

          for member in zlib zstd lz4 mbedtls curl quickjs json phnt stb \
                        magic_enum nameof scope_guard semver yacppl; do
            if [ -z "$(ls -A "bin/include/$member" 2>/dev/null)" ]; then
              echo "no staged headers for $member" >&2
              exit 1
            fi
          done

          # Members whose include root only repeated their own name are unwrapped,
          # so callers write the canonical <curl/curl.h>, <magic_enum/magic_enum.hpp>.
          for header in curl/curl.h magic_enum/magic_enum.hpp; do
            if [ ! -f "bin/include/$header" ]; then
              echo "expected bin/include/$header to be unwrapped" >&2
              exit 1
            fi
          done
          for wrapped in curl/curl magic_enum/magic_enum; do
            if [ -d "bin/include/$wrapped" ]; then
              echo "bin/include/$wrapped should not exist (duplicated name)" >&2
              exit 1
            fi
          done

          # The hub's own installer, for a consumer who does not use CMake: it has
          # to travel in the artifact, because the artifact is all a consumer gets.
          # CMakeLists.txt copies it in, so an absent one means the copy broke.
          if [ ! -f bin/Install.bat ]; then
            echo "bin/Install.bat was not staged beside include/ and lib/" >&2
            exit 1
          fi

          # One job builds one column. A member that staged into another arch — or
          # into both — would hand out an artifact no consumer could trust, and the
          # failure would only surface later as a link error, so it is caught here.
          for member in zlib zstd lz4 mbedtls curl quickjs; do
            staged="$(ls "bin/lib/$member" 2>/dev/null || true)"
            if [ "$staged" != "$arch" ]; then
              echo "bin/lib/$member stages '$staged', expected the '$arch' column" >&2
              exit 1
            fi
          done

          # The static CRT is a deliberate choice, not a default (docs/adr/0006):
          # every staged library must carry the static runtime marker and none may
          # carry the dynamic one. This is read out of the artifacts themselves, so
          # a member quietly switching runtimes cannot slip through.
          case "$config" in
            Debug)   want_static="LIBCMTD" ;;
            Release) want_static="LIBCMT" ;;
          esac
          static_crt_libraries=0
          for library in $(find bin/lib -path "*/${arch}/*" -name '*.lib'); do
            if grep -aq "$want_static" "$library"; then
              static_crt_libraries=$((static_crt_libraries + 1))
            fi
            if grep -aq 'MSVCRT' "$library"; then
              echo "$library links the dynamic CRT, expected $want_static" >&2
              exit 1
            fi
          done
          if [ "$static_crt_libraries" -eq 0 ]; then
            echo "no staged library links the static CRT ($want_static)" >&2
            exit 1
          fi
          echo "static CRT ($want_static) confirmed in $static_crt_libraries staged libraries"

          echo "--- generated runtime settings"
          grep -rho '<RuntimeLibrary>[^<]*</RuntimeLibrary>' "build/${{ matrix.configure }}" \
            --include='*.vcxproj' | sort | uniq -c || true

          for member in zlib zstd lz4 mbedtls curl quickjs; do
            if [ -z "$(find "bin/lib/$member/$arch" -path "*/${config}/*.lib" -print -quit)" ]; then
              echo "no ${config} ${arch} library staged for $member" >&2
              exit 1
            fi
          done

      # Short retention: these are the columns, published a moment later by the
      # `publish` job as the single artifact consumers are meant to take.
      - name: Upload this column
        uses: actions/upload-artifact@v7
        with:
          name: pkg-bin-${{ matrix.arch }}-${{ matrix.config }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  # The layout promises one shared include/ tree beside a lib/ column per
  # (arch, config), so the published artifact should be that shape and not four
  # separate archives. A flat merge would silently let one column's copy win, so
  # the columns are compared first - everything except lib/, which is the part
  # that is meant to differ - and the merge runs only if they agree.
  publish:
    name: publish (pkg-bin)
    needs: hub
    runs-on: windows-2022
    steps:
      - name: Collect the columns
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-bin-*
          path: columns/

      # A column's libraries are its own; everything else it stages is the hub's,
      # shared by all four - the include/ tree and the installer beside it. The
      # merge cannot tell the two apart, so the difference is taken here, where a
      # failure names the column responsible.
      - name: Check the columns agree on everything but lib/
        shell: bash
        run: |
          set -euo pipefail

          reference="$(ls -d columns/*/ | head -n1)"
          for column in columns/*/; do
            if ! diff -r --exclude=lib "${reference}" "${column}"; then
              echo "${column} stages files that differ from ${reference}" >&2
              exit 1
            fi
          done
          echo "all $(ls -d columns/*/ | wc -l) columns share one include/ tree and one Install.bat"

          echo "--- columns to be published"
          find columns -name '*.lib' | sort

      - name: Publish the hub as one artifact
        uses: actions/upload-artifact/merge@v7
        with:
          name: pkg-bin
          pattern: pkg-bin-*
          separate-directories: false
          delete-merged: true
          retention-days: 14

  # The hub's promise is the folder it publishes, not the build tree it came from.
  # So this job deliberately does not build the hub and does not clone vendor/:
  # checkout, unpack the published artifact, and use it. If that fails, the
  # artifact is not usable, however green the job that produced it was.
  #
  # It is used the two ways a consumer can: through the consumer project's own
  # CMake, and - the half that needs no CMake at all - through the Install.bat
  # that ships inside the artifact, which is what a Windows project that is not
  # built by this hub's CMake reaches for.
  consume:
    name: consume (${{ matrix.arch }} ${{ matrix.config }})
    needs: publish
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            config: Debug
          - arch: x64
            platform: x64
            config: Release
          - arch: x86
            platform: Win32
            config: Debug
          - arch: x86
            platform: Win32
            config: Release
    steps:
      - name: Checkout (source only — no submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Download the published artifact
        uses: actions/download-artifact@v8
        with:
          name: pkg-bin
          path: bin/

      - name: Show what a consumer receives
        shell: bash
        run: |
          set -euo pipefail

          # vendor/ is present only as empty gitlink directories, and they nest
          # (vendor/neargye/<member>), so "is this directory empty" is the wrong
          # question — a single file anywhere under vendor/ is the right one.
          if [ -d vendor ]; then
            leaked="$(find vendor -type f -print -quit)"
            if [ -n "$leaked" ]; then
              echo "vendor/ holds $leaked — a consumer must not need vendor/" >&2
              exit 1
            fi
            echo "vendor/ is $(find vendor -type d | wc -l) directories deep with no files"
          fi

          # Install.bat leads this listing on purpose: it is the hub's own entry
          # point, and what a consumer without CMake runs first.
          echo "--- bin/"
          ls bin
          echo "--- bin/include"
          ls bin/include
          echo "--- bin/lib"
          find bin/lib -name '*.lib' | sort

          # The published artifact is the whole hub, so every column has to be in
          # it — checked through one member that stages libraries in all of them.
          for column in x64/Debug x64/Release x86/Debug x86/Release; do
            if [ -z "$(find "bin/lib/zlib/$column" -name '*.lib' -print -quit)" ]; then
              echo "the published artifact has no $column column for zlib" >&2
              exit 1
            fi
          done

      - name: Configure the consumer (no hub CMake, no vendor)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/consumer -B build/consumer \
            -G "Visual Studio 17 2022" -A ${{ matrix.platform }} \
            -DPKG_CONFIG="${{ matrix.config }}" \
            -DPKG_ARCH="${{ matrix.arch }}"

      - name: Build and run the consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/consumer --config ${{ matrix.config }}

          for consumer in consumer_c consumer_net consumer_phnt consumer_cpp; do
            "./build/consumer/${{ matrix.config }}/${consumer}.exe"
          done

      # The artifact's other way in, and the reason Install.bat exists: no CMake,
      # no -I, no /LIBPATH. Install.bat does one thing - it works out that it is
      # sitting in the hub and stores that path in PKG_DIR, in this shell and in
      # the user's environment. Everything else is derived by whoever consumes
      # it: the include roots and the column's libraries are read off PKG_DIR
      # here, and cl.exe is expected to find them through those variables alone.
      # Compile, link and run are the assertion; the consumer source is the same
      # one the CMake step above compiles, which is what makes this a second way
      # to the same contract rather than a second contract.
      - name: Use the artifact through Install.bat, with no CMake in between
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo vswhere.exe is missing 1>&2 & exit /b 1)
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%I"
          if not defined VSDIR (echo no Visual Studio with the C++ toolchain was found 1>&2 & exit /b 1)

          rem A dev shell first, so the SDK's own INCLUDE/LIB stay underneath
          rem whatever the consumer builds from PKG_DIR.
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1

          rem No arguments on purpose: the one job it has is to name the hub.
          call "%CD%\bin\Install.bat" || exit /b 1

          rem It has to outlive the shell that ran it: that is the whole point of
          rem storing it, so the store is checked and not just the session.
          reg query "HKCU\Environment" /v PKG_DIR >nul || (echo Install.bat did not store PKG_DIR 1>&2 & exit /b 1)

          rem Everything else is read off PKG_DIR, the way any consumer without
          rem CMake would: the include roots consumer_c.c includes, ahead of the
          rem SDK's INCLUDE, and the column's libraries through LIB without
          rem naming a single directory here. Globbing on purpose - the hub
          rem renames libraries per config, and this probe should not have to
          rem know that either.
          set "PKG_INCLUDE=%PKG_DIR%\include"
          set "INCLUDE=%PKG_INCLUDE%\zlib;%PKG_INCLUDE%\zstd;%PKG_INCLUDE%\lz4;%PKG_INCLUDE%\mbedtls;%PKG_INCLUDE%\quickjs;%PKG_INCLUDE%\stb;%INCLUDE%"
          set "LIBS="
          for %%F in ("%PKG_DIR%\lib\*\${{ matrix.arch }}\${{ matrix.config }}\*.lib") do call set "LIBS=%%LIBS%% "%%~F""

          if not exist build mkdir build
          rem /MTd under Debug and /MT under Release, the hub's static CRT (ADR-0006):
          rem a mismatched runtime is LNK2038, which is the intended loud failure.
          cl /nologo ${{ matrix.config == 'Debug' && '/MTd' || '/MT' }} /Fo:build\ /Fe:build\install-probe.exe "%CD%\tests\consumer\consumer_c.c" /link ws2_32.lib bcrypt.lib %LIBS% || exit /b 1

          build\install-probe.exe || exit /b 1
          echo Install.bat named the hub and cl.exe built and ran against it
