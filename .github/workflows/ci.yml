name: ci

# CI is the build environment for this hub (docs/adr/0002): nothing is built on a
# developer machine. Every branch whose content is meant to be trusted builds
# here — the experiment branch while it is being proven, main once it lands, and
# every pull request aimed at main.
#
# Four jobs on purpose. `hub` builds one (arch, config) column; `publish` folds
# the columns into the single artifact the layout promises; `consume` builds
# nothing at all, downloads that artifact and uses it the way another project
# would; `setup` turns that same artifact into the per-user setup.exe a Windows
# user can double-click, and proves the installer - not the zip it wraps.
# Splitting them is what lets the last jobs prove the hub's actual promises —
# the published bin/ and the installer built from it - instead of the build
# tree they happened to come from.
on:
  push:
    branches:
      - main
      - cmake/harness
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target matrix to build'
        required: true
        default: 'x64-release'
        type: choice
        options:
          - 'x64-release'
          - 'x64-debug'
          - 'x86-release'
          - 'x86-debug'
          - 'all'

permissions:
  contents: read

jobs:
  matrix:
    name: resolve-matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - id: set-matrix
        run: |
          target="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'x64-release' }}"
          case "$target" in
            x64-release)
              matrix='[{"arch":"x64","platform":"x64","configure":"ci-x64","build":"x64-Release","config":"Release","id":"x64-release"}]'
              ;;
            x64-debug)
              matrix='[{"arch":"x64","platform":"x64","configure":"ci-x64","build":"x64-Debug","config":"Debug","id":"x64-debug"}]'
              ;;
            x86-release)
              matrix='[{"arch":"x86","platform":"Win32","configure":"ci-x86","build":"x86-Release","config":"Release","id":"x86-release"}]'
              ;;
            x86-debug)
              matrix='[{"arch":"x86","platform":"Win32","configure":"ci-x86","build":"x86-Debug","config":"Debug","id":"x86-debug"}]'
              ;;
            all)
              matrix='[{"arch":"x64","platform":"x64","configure":"ci-x64","build":"x64-Release","config":"Release","id":"x64-release"},{"arch":"x64","platform":"x64","configure":"ci-x64","build":"x64-Debug","config":"Debug","id":"x64-debug"},{"arch":"x86","platform":"Win32","configure":"ci-x86","build":"x86-Release","config":"Release","id":"x86-release"},{"arch":"x86","platform":"Win32","configure":"ci-x86","build":"x86-Debug","config":"Debug","id":"x86-debug"}]'
              ;;
            *)
              echo "Unknown target $target" >&2
              exit 1
              ;;
          esac
          echo "targets=$matrix" >> "$GITHUB_OUTPUT"

  hub:
    name: hub (${{ matrix.arch }} ${{ matrix.config }})
    needs: matrix
    # Pinned image label, not windows-latest: the toolchain (VS 2022, CMake) is
    # part of the input here, so it must not move under us. It is also why both
    # architectures build on this one runner — windows-2022 is the pinned image and
    # Win32 builds natively on it, so x86 costs configuration time, nothing more.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      # Shallow everywhere, recursively, because mbedtls needs its nested
      # `framework` submodule or its configure aborts.
      - name: Clone vendor submodules (shallow, recursive)
        run: git submodule update --init --recursive --depth 1 --jobs 4

      - name: Show toolchain
        run: |
          echo "arch=${{ matrix.arch }} platform=${{ matrix.platform }} config=${{ matrix.config }}"
          cmake --version
          git --version

      - name: Guard — CMake too old (>= 3.25 required)
        shell: bash
        run: |
          set -euo pipefail
          version="$(cmake --version | head -n1 | sed -E 's/[^0-9.]//g')"
          required="3.25"
          oldest="$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)"
          if [ "$oldest" != "$required" ]; then
            echo "CMake $version is older than the required $required" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.build }} --parallel
          find bin -name '*.pdb' -delete || true

      - name: Assert the staged hub is complete and signed off
        shell: bash
        run: |
          set -euo pipefail
          config="${{ matrix.config }}"
          arch="${{ matrix.arch }}"

          echo "--- bin/include"
          ls bin/include
          echo "--- bin/lib"
          find bin/lib -type f | sort

          # Which members exist is one statement, members.txt at the repository root,
          # read by every check here and by the consumer project — so a member added to
          # the hub is asserted everywhere at once, and one removed disappears from all
          # of them rather than from all but one. The flag column marks the members that
          # stage a library beside their headers.
          # The carriage returns go first so the fields below are read the same way
          # however the checkout spelled the file: the flag is the last field on its
          # line, which is exactly where a CRLF line ending would land.
          all_members="$(tr -d '\r' < members.txt | awk '!/^#/ && NF { print $1 }')"
          library_members="$(tr -d '\r' < members.txt | awk '!/^#/ && $2 == "lib" { print $1 }')"
          # An empty roster would make every loop below pass without checking anything,
          # which is the one failure that must not be silent.
          if [ -z "$all_members" ] || [ -z "$library_members" ]; then
            echo "members.txt names no members (or no library members)" >&2
            exit 1
          fi

          for member in $all_members; do
            if [ -z "$(ls -A "bin/include/$member" 2>/dev/null)" ]; then
              echo "no staged headers for $member" >&2
              exit 1
            fi
          done

          # Members whose include root only repeated their own name are unwrapped,
          # so callers write the canonical <curl/curl.h>, <magic_enum/magic_enum.hpp>.
          for header in curl/curl.h magic_enum/magic_enum.hpp; do
            if [ ! -f "bin/include/$header" ]; then
              echo "expected bin/include/$header to be unwrapped" >&2
              exit 1
            fi
          done
          for wrapped in curl/curl magic_enum/magic_enum; do
            if [ -d "bin/include/$wrapped" ]; then
              echo "bin/include/$wrapped should not exist (duplicated name)" >&2
              exit 1
            fi
          done

          # imgui's include shape is the one upstream's own project files produce:
          # the core headers flat, each selected backend's header beside them, and
          # misc/cpp nested, because that is the spelling upstream documents for the
          # std::string helpers.
          for header in imgui/imgui.h imgui/imgui_internal.h imgui/misc/cpp/imgui_stdlib.h; do
            if [ ! -f "bin/include/$header" ]; then
              echo "expected bin/include/$header to be staged" >&2
              exit 1
            fi
          done

          # ...and the header of every backend of the default selection sits beside
          # them, because a backend a consumer cannot name is a library it cannot use.
          for backend in win32 dx9 dx10 dx11 dx12 opengl2 opengl3 null; do
            if [ ! -f "bin/include/imgui/imgui_impl_${backend}.h" ]; then
              echo "expected bin/include/imgui/imgui_impl_${backend}.h to be staged" >&2
              exit 1
            fi
          done

          # ...and the implementation of those helpers stays out of it: it is inside
          # the core library, and staging it beside the header would invite a second
          # copy of it into a consumer's build.
          if [ -f bin/include/imgui/misc/cpp/imgui_stdlib.cpp ]; then
            echo "bin/include/imgui/misc/cpp/imgui_stdlib.cpp should not be staged" >&2
            exit 1
          fi

          if [ ! -f "bin/include/frida/frida-core.h" ]; then
            echo "expected bin/include/frida/frida-core.h to be staged" >&2
            exit 1
          fi

          # The hub's own installer, for a consumer who does not use CMake: it has
          # to travel in the artifact, because the artifact is all a consumer gets.
          # CMakeLists.txt copies it in, so an absent one means the copy broke.
          if [ ! -f bin/Install.bat ]; then
            echo "bin/Install.bat was not staged beside include/ and lib/" >&2
            exit 1
          fi

          # One job builds one column. A member that staged into another arch — or
          # into both — would hand out an artifact no consumer could trust, and the
          # failure would only surface later as a link error, so it is caught here.
          for member in $library_members; do
            staged="$(ls "bin/lib/$member" 2>/dev/null || true)"
            if [ "$staged" != "$arch" ]; then
              echo "bin/lib/$member stages '$staged', expected the '$arch' column" >&2
              exit 1
            fi
          done

          # The dynamic CRT is a deliberate choice, not a default:
          # every staged library must carry the dynamic runtime marker and none may
          # carry the static one. This is read out of the artifacts themselves, so
          # a member quietly switching runtimes cannot slip through.
          case "$config" in
            Debug)   want_dynamic="MSVCRTD" ;;
            Release) want_dynamic="MSVCRT" ;;
          esac
          dynamic_crt_libraries=0
          for library in $(find bin/lib -path "*/${arch}/*" -name '*.lib'); do
            if grep -aq "$want_dynamic" "$library"; then
              dynamic_crt_libraries=$((dynamic_crt_libraries + 1))
            fi
            if grep -aq 'LIBCMT' "$library"; then
              echo "$library links the static CRT, expected $want_dynamic" >&2
              exit 1
            fi
          done
          if [ "$dynamic_crt_libraries" -eq 0 ]; then
            echo "no staged library links the dynamic CRT ($want_dynamic)" >&2
            exit 1
          fi
          if [ -n "$(find bin -name '*.pdb' -print -quit)" ]; then
            echo "bin/ contains PDB files, expected none" >&2
            find bin -name '*.pdb'
            exit 1
          fi
          echo "confirmed no PDB files staged in bin/"

          echo "--- generated runtime settings"
          grep -rho '<RuntimeLibrary>[^<]*</RuntimeLibrary>' "build/${{ matrix.configure }}" \
            --include='*.vcxproj' | sort | uniq -c || true

          for member in $library_members; do
            if [ -z "$(find "bin/lib/$member/$arch" -path "*/${config}/*.lib" -print -quit)" ]; then
              echo "no ${config} ${arch} library staged for $member" >&2
              exit 1
            fi
          done

          # imgui is the first member that stages more than one library: its core
          # beside a part per backend of the default selection. The loop above is
          # satisfied by the core alone, so the parts are named here — a member that
          # staged only some of them would pass that check and still hand out an
          # artifact promising a part it does not carry. Matched on the name suffix
          # each part's library carries rather than on a full file name, so this still
          # does not have to know what the hub calls its libraries.
          for backend in win32 dx9 dx10 dx11 dx12 opengl2 opengl3 null; do
            if [ -z "$(find "bin/lib/imgui/$arch/$config" -name "*_${backend}.lib" -print -quit)" ]; then
              echo "imgui staged no ${backend} backend library in ${arch}/${config}" >&2
              exit 1
            fi
          done
          echo "imgui staged its core and all eight SDK-only backends in ${arch}/${config}"

      # The selection option is the one thing about imgui that a build cannot show:
      # "not selected" means the backend is not a target at all, and a target that
      # does not exist has no artifact to look at. So it is proven here instead, by
      # configuring the hub with lists other than the default, into a build tree of
      # its own, and asking what each configure produced. Nothing is compiled, so the
      # check costs configures rather than a second build.
      - name: Probe the imgui backend selection (configure only)
        shell: bash
        run: |
          set -euo pipefail
          probe="build/probe-imgui-backends-${{ matrix.arch }}"
          log="${probe}.log"
          unknown_log="${probe}-unknown.log"

          # Half one: the list narrowed to one backend. The selected backend is a
          # target and the excluded one is not — in the Visual Studio generator that
          # is a project file in the build tree. A fresh tree, so nothing this
          # configure did not write can be mistaken for something it did.
          rm -rf "$probe" "$log" "$unknown_log"
          if ! cmake --preset probe-imgui-backends-${{ matrix.arch }} > "$log" 2>&1; then
            echo "configuring with the probe preset failed" >&2
            tail -n 40 "$log" >&2
            exit 1
          fi
          if [ -z "$(find "$probe" -name 'imgui_impl_win32.vcxproj' -print -quit)" ]; then
            echo "PKG_IMGUI_BACKENDS=win32 produced no target for imgui_impl_win32" >&2
            exit 1
          fi
          if [ -n "$(find "$probe" -name 'imgui_impl_dx11.vcxproj' -print -quit)" ]; then
            echo "PKG_IMGUI_BACKENDS=win32 still produced a target for imgui_impl_dx11" >&2
            exit 1
          fi
          echo "narrowed selection: imgui_impl_win32 is a target, imgui_impl_dx11 is not"

          # Half two: the empty list, which is the other end of the same promise —
          # excluding every backend leaves the core on its own. A fresh tree again, so
          # the check is on what this configure wrote and nothing else.
          rm -rf "$probe"
          if ! cmake --preset probe-imgui-backends-${{ matrix.arch }} \
               -DPKG_IMGUI_BACKENDS= > "$log" 2>&1; then
            echo "configuring with an empty PKG_IMGUI_BACKENDS failed" >&2
            tail -n 40 "$log" >&2
            exit 1
          fi
          if [ -z "$(find "$probe" -name 'imgui.vcxproj' -print -quit)" ]; then
            echo "PKG_IMGUI_BACKENDS= produced no target for the imgui core" >&2
            exit 1
          fi
          if [ -n "$(find "$probe" -name 'imgui_*.vcxproj' -print -quit)" ]; then
            echo "PKG_IMGUI_BACKENDS= still produced a backend target" >&2
            exit 1
          fi
          echo "empty selection: the core is a target and no backend is"

          # Half three: a name that is not a backend stops the configure and prints
          # the accepted set, the way the hub's other failures read. The same preset,
          # its list overridden on the command line, so it is the same configure path.
          if cmake --preset probe-imgui-backends-${{ matrix.arch }} \
               -DPKG_IMGUI_BACKENDS=glfw > "$unknown_log" 2>&1; then
            echo "PKG_IMGUI_BACKENDS=glfw configured successfully" >&2
            exit 1
          fi
          # CMake wraps a long message to the output width, so the log is collapsed
          # to one line before it is asked anything: where a line break fell is not
          # part of what the hub promises to print.
          failure="$(tr '\n' ' ' < "$unknown_log" | tr -s ' ')"
          if ! printf '%s' "$failure" | grep -qF "PKG_IMGUI_BACKENDS names 'glfw'"; then
            echo "the unknown-backend failure did not name the value it rejected" >&2
            tail -n 40 "$unknown_log" >&2
            exit 1
          fi
          if ! printf '%s' "$failure" | grep -q 'accepted backends:.*win32'; then
            echo "the unknown-backend failure did not name the accepted set" >&2
            tail -n 40 "$unknown_log" >&2
            exit 1
          fi
          echo "unknown backend name: the configure failed and named the accepted set"

      # Short retention: these are the columns, published a moment later by the
      # `publish` job as the single artifact consumers are meant to take.
      - name: Upload this column
        uses: actions/upload-artifact@v7
        with:
          name: pkg-bin-${{ matrix.arch }}-${{ matrix.config }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  # The layout promises one shared include/ tree beside a lib/ column per
  # (arch, config), so the published artifact should be that shape and not four
  # separate archives. A flat merge would silently let one column's copy win, so
  # the columns are compared first - everything except lib/, which is the part
  # that is meant to differ - and the merge runs only if they agree.
  publish:
    name: publish (pkg-bin)
    needs: hub
    runs-on: windows-2022
    steps:
      - name: Collect the columns
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-bin-*
          path: columns/

      # A column's libraries are its own; everything else it stages is the hub's,
      # shared by all four - the include/ tree and the installer beside it. The
      # merge cannot tell the two apart, so the difference is taken here, where a
      # failure names the column responsible.
      - name: Check the columns agree on everything but lib/
        shell: bash
        run: |
          set -euo pipefail

          cols=()
          for d in columns/pkg-bin-*/; do
            [ -d "$d" ] && cols+=("$d")
          done

          if [ "${#cols[@]}" -gt 1 ]; then
            reference="${cols[0]}"
            for column in "${cols[@]}"; do
              if ! diff -r --exclude=lib "${reference}" "${column}"; then
                echo "${column} stages files that differ from ${reference}" >&2
                exit 1
              fi
            done
            echo "all ${#cols[@]} columns share one include/ tree and one Install.bat"
          else
            echo "single column (${#cols[@]}): skipping diff"
          fi

          echo "--- columns to be published"
          find columns -name '*.lib' | sort

      - name: Publish the hub as one artifact
        uses: actions/upload-artifact/merge@v7
        with:
          name: pkg-bin
          pattern: pkg-bin-*
          separate-directories: false
          delete-merged: true
          retention-days: 14

  # The hub's promise is the folder it publishes, not the build tree it came from.
  # So this job deliberately does not build the hub and does not clone vendor/:
  # checkout, unpack the published artifact, and use it. If that fails, the
  # artifact is not usable, however green the job that produced it was.
  #
  # It is used the two ways a consumer can: through the consumer project's own
  # CMake, and - the half that needs no CMake at all - through the Install.bat
  # that ships inside the artifact, which is what a Windows project that is not
  # built by this hub's CMake reaches for.
  consume:
    name: consume (${{ matrix.arch }} ${{ matrix.config }})
    needs: [matrix, publish]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - name: Checkout (source only — no submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Download the published artifact
        uses: actions/download-artifact@v8
        with:
          name: pkg-bin
          path: bin/

      - name: Show what a consumer receives
        shell: bash
        run: |
          set -euo pipefail

          # vendor/ is present only as empty gitlink directories, and they nest
          # (vendor/neargye/<member>), so "is this directory empty" is the wrong
          # question — a single file anywhere under vendor/ is the right one.
          if [ -d vendor ]; then
            leaked="$(find vendor -type f -print -quit)"
            if [ -n "$leaked" ]; then
              echo "vendor/ holds $leaked — a consumer must not need vendor/" >&2
              exit 1
            fi
            echo "vendor/ is $(find vendor -type d | wc -l) directories deep with no files"
          fi

          # Install.bat leads this listing on purpose: it is the hub's own entry
          # point, and what a consumer without CMake runs first.
          echo "--- bin/"
          ls bin
          echo "--- bin/include"
          ls bin/include
          echo "--- bin/lib"
          find bin/lib -name '*.lib' | sort

          # Assert at least one column is staged for zlib
          zlib_found="$(find bin/lib/zlib -name '*.lib' -print -quit)"
          if [ -z "$zlib_found" ]; then
            echo "the published artifact has no columns for zlib" >&2
            exit 1
          fi

      - name: Configure the consumer (no hub CMake, no vendor)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/consumer -B build/consumer \
            -G "Visual Studio 17 2022" -A ${{ matrix.platform }} \
            -DPKG_CONFIG="${{ matrix.config }}" \
            -DPKG_ARCH="${{ matrix.arch }}"

      - name: Build and run the consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/consumer --config ${{ matrix.config }} --parallel

          for consumer in consumer_c consumer_net consumer_phnt consumer_cpp consumer_imgui consumer_yara; do
            "./build/consumer/${{ matrix.config }}/${consumer}.exe"
          done

      # The artifact's other way in, and the reason Install.bat exists: no CMake,
      # no -I, no /LIBPATH. Install.bat does one thing - it works out that it is
      # sitting in the hub and stores that path in PKG_DIR, in this shell and in
      # the user's environment. Everything else is derived by whoever consumes
      # it: the include roots and the column's libraries are read off PKG_DIR
      # here, and cl.exe is expected to find them through those variables alone.
      # Compile, link and run are the assertion; the consumer source is the same
      # one the CMake step above compiles, which is what makes this a second way
      # to the same contract rather than a second contract.
      - name: Use the artifact through Install.bat, with no CMake in between
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo vswhere.exe is missing 1>&2 & exit /b 1)
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%I"
          if not defined VSDIR (echo no Visual Studio with the C++ toolchain was found 1>&2 & exit /b 1)

          rem A dev shell first, so the SDK's own INCLUDE/LIB stay underneath
          rem whatever the consumer builds from PKG_DIR.
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1

          rem No arguments on purpose: the one job it has is to name the hub.
          call "%CD%\bin\Install.bat" || exit /b 1

          rem It has to outlive the shell that ran it: that is the whole point of
          rem storing it, so the store is checked and not just the session.
          reg query "HKCU\Environment" /v PKG_DIR >nul || (echo Install.bat did not store PKG_DIR 1>&2 & exit /b 1)

          rem The column's libraries, found the way the linker finds them: through
          rem LIB, without naming a single directory here. The two-step loop is
          rem not style: cmd expands wildcards in the last path component only,
          rem so lib\*\<arch>\<config>\*.lib as one glob matches nothing at all.
          rem Walking the members first also makes an empty member harmless.
          rem Globbing stays on purpose - the hub renames libraries per config,
          rem and this probe should not have to know that either.
          set "PKG_INCLUDE=%PKG_DIR%\include"
          set "INCLUDE=%PKG_INCLUDE%\zlib;%PKG_INCLUDE%\zstd;%PKG_INCLUDE%\lz4;%PKG_INCLUDE%\mbedtls;%PKG_INCLUDE%\quickjs;%PKG_INCLUDE%\stb;%INCLUDE%"
          set "LIBS="
          for /d %%M in ("%PKG_DIR%\lib\*") do for %%F in ("%%~M\${{ matrix.arch }}\${{ matrix.config }}\*.lib") do call set "LIBS=%%LIBS%% "%%~F""
          if not defined LIBS (echo no staged libraries under PKG_DIR for ${{ matrix.arch }} ${{ matrix.config }} 1>&2 & exit /b 1)

          if not exist build mkdir build
          rem /MDd under Debug and /MD under Release, the hub's dynamic CRT:
          rem a mismatched runtime is LNK2038, which is the intended loud failure.
          cl /nologo ${{ matrix.config == 'Debug' && '/MDd' || '/MD' }} /Fo:build\ /Fe:build\install-probe.exe "%CD%\tests\consumer\consumer_c.c" /link ws2_32.lib bcrypt.lib %LIBS% || exit /b 1

          build\install-probe.exe || exit /b 1
          echo Install.bat named the hub and cl.exe built and ran against it

  # The artifact has one more way in, for the consumer who double-clicks: a
  # per-user setup.exe (docs/adr/0007). The installer packages the artifact
  # exactly as published - no renaming, no re-laying-out - because anything
  # else would make the setup.exe promise a different hub than the zip does.
  # What is proven here is the installer itself: silent install, the installed
  # tree, PKG_DIR set and stored, a compile through %PKG_DIR% alone, then the
  # uninstall and the guarantee that it clears the stored value only when it
  # points at the folder being removed.
  setup:
    name: setup (pkg-setup)
    needs: publish
    runs-on: windows-2022
    steps:
      - name: Checkout (the .iss only — no submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Download the published artifact
        uses: actions/download-artifact@v8
        with:
          name: pkg-bin
          path: artifact/

      - name: Compile the installer (Inno Setup, preinstalled on the pinned image)
        shell: cmd
        run: |
          rem The version travels with the exe's name and its Add-Remove entry:
          rem CI-built builds are numbered by run, traced back by full SHA.
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DpkgVersion=0.${{ github.run_number }}+${{ github.sha }} setup\pkg.iss || exit /b 1
          rem The .iss sets OutputBaseFilename=pkg-setup-<version>, OutputDir=.:
          rem the exe lands in the repo root, next to the artifact it wrapped.
          if not exist pkg-setup-*.exe (echo ISCC produced no pkg-setup-*.exe 1>&2 & exit /b 1)

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: pkg-setup
          path: pkg-setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Prove it - silent install, use, uninstall, and what remains
        shell: cmd
        run: |
          set "SETUPEXE="
          for %%F in (pkg-setup-*.exe) do set "SETUPEXE=%%F"

          rem Silent, per-user, into a temp folder - the same path a real user's
          rem double-click takes, minus the wizard pages.
          set "INSTALLDIR=%TEMP%\pkg-smoke"
          rmdir /s /q "%INSTALLDIR%" 2>nul
          "%SETUPEXE%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="%INSTALLDIR%" || exit /b 1

          rem The tree, not a spot check: everything the artifact had is here.
          if not exist "%INSTALLDIR%\Install.bat" (echo the installer dropped Install.bat 1>&2 & exit /b 1)
          rem The roster is members.txt, the same file the hub job and the consumer
          rem project read, so the installer is checked against the members the hub
          rem says exist rather than against a list kept here. Every miss is named
          rem rather than the first one, and the step fails once, after the loop: an
          rem "exit /b" inside a block whose next statement is another "if" leaves cmd
          rem reporting success, which would print the failure and pass the step.
          if not exist members.txt (echo no member roster at members.txt 1>&2 & exit /b 1)
          set "roster_members=0"
          set "roster_missing=0"
          for /f "usebackq tokens=1,2" %%A in ("members.txt") do (
            if not "%%A"=="#" (
              set /a roster_members+=1
              if not exist "%INSTALLDIR%\include\%%A" (echo the installer dropped include\%%A 1>&2 & set /a roster_missing+=1)
              if "%%B"=="lib" (
                rem Check if any library was staged for this member
                set "member_lib_found="
                for /f "delims=" %%F in ('dir /s /b "%INSTALLDIR%\lib\%%A\*.lib" 2^>nul') do set "member_lib_found=1"
                if not defined member_lib_found (echo the installer dropped lib\%%A 1>&2 & set /a roster_missing+=1)
              )
            )
          )
          rem A roster naming no members would leave every check here having read nothing,
          rem and would report success — the one failure that must not be silent.
          if "%roster_members%"=="0" (echo members.txt names no members 1>&2 & exit /b 1)
          if not "%roster_missing%"=="0" (echo the installed tree is missing %roster_missing% of the paths members.txt names 1>&2 & exit /b 1)

          rem Install.bat ran as the last setup step: the stored value has to be
          rem there, and to name the folder the installer chose.
          reg query "HKCU\Environment" /v PKG_DIR | findstr /i /c:"%INSTALLDIR%" >nul || (echo PKG_DIR was not stored at the install folder 1>&2 & exit /b 1)

          rem This step's shell started before setx wrote, so its own PKG_DIR is
          rem empty - a value stored now reaches only shells opened later, which
          rem is the whole point of storing it. Loading it here is what a fresh
          rem consumer shell does by itself, and what the rest of this step runs
          rem against. The consume job proves the session half of the contract;
          rem this is the stored half.
          for /f "tokens=2*" %%A in ('reg query "HKCU\Environment" /v PKG_DIR ^| findstr PKG_DIR') do set "PKG_DIR=%%B"
          echo PKG_DIR is %PKG_DIR%

          rem A dev shell, then the installed hub - the same way consume uses the
          rem unpacked artifact, so this proves the setup.exe and not the runner.
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%I in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%I"
          if not defined VSDIR (echo no Visual Studio with the C++ toolchain was found 1>&2 & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1

          rem Everything off PKG_DIR, exactly as the artifact's other way in.
          set "PKG_INCLUDE=%PKG_DIR%\include"
          set "INCLUDE=%PKG_INCLUDE%\zlib;%PKG_INCLUDE%\zstd;%PKG_INCLUDE%\lz4;%PKG_INCLUDE%\mbedtls;%PKG_INCLUDE%\quickjs;%PKG_INCLUDE%\stb;%INCLUDE%"
          set "LIBS="
          rem Two steps, not style: cmd expands wildcards in the last path
          rem component only, so one glob with lib\* in the middle matches
          rem nothing. Walking the members also makes an empty member harmless.
          for /d %%M in ("%PKG_DIR%\lib\*") do for /f "delims=" %%F in ('dir /s /b "%%~M\*.lib" 2^>nul') do call set "LIBS=%%LIBS%% "%%~F""
          if not defined LIBS (echo no staged libraries under PKG_DIR 1>&2 & exit /b 1)

          if not exist build mkdir build
          cl /nologo /MD /Fo:build\ /Fe:build\setup-probe.exe "%CD%\tests\consumer\consumer_c.c" /link ws2_32.lib bcrypt.lib %LIBS% || exit /b 1
          build\setup-probe.exe || exit /b 1

          rem --- the uninstall, and what it must leave behind ---
          if not exist "%INSTALLDIR%\unins000.exe" (echo no uninstaller at the install folder 1>&2 & exit /b 1)
          "%INSTALLDIR%\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || exit /b 1
          rem Inno's uninstaller detaches; wait for the folder to go. ping, not
          rem timeout: timeout refuses a redirected stdin, which is exactly what
          rem a runner step has.
          set /a TRIES=0
          :wait_gone
          ping -n 3 127.0.0.1 >nul
          if exist "%INSTALLDIR%" (set /a TRIES+=1 & if %TRIES% lss 15 goto wait_gone)
          if exist "%INSTALLDIR%" (echo the uninstall left the install folder behind 1>&2 & exit /b 1)

          rem The folder is gone, so the stored value must be gone with it - it
          rem pointed here, and clearing it is the uninstall's last act. A value
          rem left pointing into a deleted folder is the one bug this check is for.
          reg query "HKCU\Environment" /v PKG_DIR >nul 2>&1 && (echo PKG_DIR survived the uninstall 1>&2 & exit /b 1)

          rem And a hub installed some other way is none of its business: install
          rem the same build once more, point PKG_DIR somewhere else on purpose,
          rem and uninstall - the foreign value must walk out untouched.
          "%SETUPEXE%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="%INSTALLDIR%" || exit /b 1
          setx PKG_DIR "C:\not-this-pkg" >nul
          "%INSTALLDIR%\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || exit /b 1
          set /a TRIES=0
          :wait_gone2
          ping -n 3 127.0.0.1 >nul
          if exist "%INSTALLDIR%" (set /a TRIES+=1 & if %TRIES% lss 15 goto wait_gone2)
          reg query "HKCU\Environment" /v PKG_DIR | findstr /i /c:"not-this-pkg" >nul || (echo the uninstall cleared a foreign PKG_DIR 1>&2 & exit /b 1)
          rem leave the runner's HKCU the way it was found
          reg delete "HKCU\Environment" /v PKG_DIR /f >nul 2>&1

          echo setup.exe installed, was built against, uninstalled, and uninstalled politely
